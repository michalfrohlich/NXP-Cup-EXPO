[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306
    olikraus/U8g2
build_src_filter =
    +<*>

[env:teensy41-sdtest]
extends = env:teensy41
monitor_speed = 115200
build_flags =
    -DTEENSY_APP_SELECTED_MODE=TEENSY_APP_MODE_SD_LOG_TEST

[env:teensy41-camera-bench]
extends = env:teensy41
build_flags =
    -DTEENSY_APP_SELECTED_MODE=TEENSY_APP_MODE_CAMERA_BENCH

[env:teensy41-hardware-test]
extends = env:teensy41
monitor_speed = 115200
build_flags =
    -DTEENSY_APP_SELECTED_MODE=TEENSY_APP_MODE_HARDWARE_TEST

[env:teensy41-stack-drive]
extends = env:teensy41
monitor_speed = 115200
build_flags =
    -DTEENSY_APP_SELECTED_MODE=TEENSY_APP_MODE_STACK_DRIVE
