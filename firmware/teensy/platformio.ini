[teensy_mode_sources]
build_src_filter =
    +<*>
    -<app/modes/*.cpp>

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306
    olikraus/U8g2
build_src_filter =
    ${teensy_mode_sources.build_src_filter}
    +<app/modes/mode_race.cpp>

[env:teensy41-race]
extends = env:teensy41
build_flags =
    -DTEENSY_APP_SELECTED_MODE=TEENSY_APP_MODE_RACE
build_src_filter =
    ${teensy_mode_sources.build_src_filter}
    +<app/modes/mode_race.cpp>

[env:teensy41-link-bench]
