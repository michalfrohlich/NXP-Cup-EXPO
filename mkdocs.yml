site_name: NXP Cup Car Firmware
site_description: Engineering documentation for the multi-board NXP Cup car firmware.
site_url: https://michalfrohlich.github.io/NXP-Cup-EXPO/
repo_url: https://github.com/michalfrohlich/NXP-Cup-EXPO

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - System:
      - Architecture And Responsibilities: system/README.md
      - Modes And Board Combinations: system/modes.md
      - LEDs And Displays: system/status-led-semantics.md
      - Testing Guide: system/testing.md
      - Engineering Findings: system/findings.md
  - Firmware:
      - S32K Application: firmware/s32k.md
      - Teensy Application: firmware/teensy.md
      - ESP32 Application: firmware/esp32.md
  - Protocols:
      - Overview: protocols/README.md
      - Teensy SPI Test: protocols/teensy-s32k-spi-test.md
      - Tuning And Drive Commands: protocols/tuning.md
  - Tooling:
      - MkDocs: tooling/mkdocs.md
      - Pre-Commit And Formatting: tooling/pre-commit-and-formatting.md
